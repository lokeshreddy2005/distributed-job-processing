# Reference orchestration for environments where Docker IS available.
# This repository was actually built and verified on a Windows host without
# Docker Desktop installed and without admin rights — see scripts/*.ps1 and
# README.md "Running without Docker" for the equivalent local-process setup
# that was used for every result (tests, load test, failure injection) in
# this repo. This compose file is provided so the same architecture can be
# run the "normal" containerized way elsewhere; it has not been exercised in
# this environment.
version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobsdb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api, worker]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgres
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgres
      WORKER_METRICS_BASE_PORT: 9101
    deploy:
      replicas: 3
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
